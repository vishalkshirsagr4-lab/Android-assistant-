<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10121d;font-family:Arial,sans-serif}
#stage{position:absolute;inset:0}
#status{position:absolute;right:14px;bottom:13px;color:#d9d7ff;background:#171a2acc;border:1px solid #7770c955;border-radius:18px;padding:7px 11px;font-size:11px}
#actions{position:absolute;right:12px;top:10px;display:flex;gap:6px}
button{border:1px solid #7770c977;background:#171a2add;color:#fff;border-radius:16px;padding:7px 10px;font-size:11px}
#loading{position:absolute;inset:0;display:grid;place-items:center;color:#d9d7ff;font-size:13px}
</style>
</head>
<body>
<div id="stage"></div><div id="loading">Loading Lucy's 3D avatar…</div>
<div id="actions">
<button onclick="playClip('greeting')">Wave</button>
<button onclick="playClip('dance')">Dance</button>
<button onclick="playClip('peaceSign')">Peace</button>
</div>
<div id="status">Ready</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/loaders/GLTFLoader.js';
import { VRMLoaderPlugin, VRMUtils } from 'https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.3.0/lib/three-vrm.module.js';
import { VRMAnimationLoaderPlugin, createVRMAnimationClip } from 'https://cdn.jsdelivr.net/npm/@pixiv/three-vrm-animation@3.3.0/lib/three-vrm-animation.module.js';

const host=document.getElementById('stage');
const loading=document.getElementById('loading');
const status=document.getElementById('status');
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(30,1,0.1,100);
camera.position.set(0,1.35,3.2);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.outputColorSpace=THREE.SRGBColorSpace;
host.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x45405f,2.0));
const key=new THREE.DirectionalLight(0xffffff,2.2);key.position.set(1,2,3);scene.add(key);
const fill=new THREE.PointLight(0x8278ff,18,8);fill.position.set(-1,1.5,1.5);scene.add(fill);
const loader=new GLTFLoader();
loader.register(parser=>new VRMLoaderPlugin(parser));
loader.register(parser=>new VRMAnimationLoaderPlugin(parser));
let vrm=null,mixer=null,currentAction=null,lastTime=0;
const clipCache=new Map();
function resize(){const w=host.clientWidth||innerWidth,h=host.clientHeight||270;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
new ResizeObserver(resize).observe(host);resize();

async function loadClip(name){
 if(clipCache.has(name))return clipCache.get(name);
 const gltf=await loader.loadAsync('../amica/animations/'+name+'.vrma');
 const animation=gltf.userData.vrmAnimations?.[0];
 if(!animation)throw new Error('Animation not found: '+name);
 const clip=createVRMAnimationClip(animation,vrm);
 clipCache.set(name,clip);return clip;
}
async function playClip(name){
 if(!vrm||!mixer)return;
 try{
  const clip=await loadClip(name);
  if(currentAction)currentAction.fadeOut(.18);
  currentAction=mixer.clipAction(clip);
  currentAction.reset().fadeIn(.18).play();
 }catch(e){console.warn('Could not play '+name,e);}
}
window.playClip=playClip;
window.setAssistantState=function(state){
 const labels={idle:'Ready',listening:'Listening',capturing:'Looking at screen',analyzing:'Thinking',speaking:'Speaking',executingAction:'Working',waitingConfirmation:'Waiting'};
 status.textContent=labels[state]||'Ready';
 if(vrm?.expressionManager){
  vrm.expressionManager.setValue('happy',state==='listening'?0.25:0.05);
  vrm.expressionManager.setValue('relaxed',state==='idle'?0.25:0.05);
 }
};

try{
 const gltf=await loader.loadAsync('../amica/vrm/AvatarSample_A.vrm');
 vrm=gltf.userData.vrm;
 if(!vrm)throw new Error('The selected VRM model did not contain a VRM avatar.');
 VRMUtils.rotateVRM0(vrm);
 scene.add(vrm.scene);
 vrm.scene.position.set(0,-0.95,0);
 vrm.scene.rotation.y=Math.PI;
 mixer=new THREE.AnimationMixer(vrm.scene);
 await playClip('idle_loop');
 loading.style.display='none';
}catch(error){
 loading.textContent='Avatar unavailable. Please check your connection and reload.';
 console.error(error);
}
function animate(now){
 requestAnimationFrame(animate);
 const delta=lastTime?Math.min((now-lastTime)/1000,.05):0;lastTime=now;
 if(mixer)mixer.update(delta);
 if(vrm){
  vrm.update(delta);
  if(vrm.expressionManager){
   const talking=status.textContent==='Speaking';
   vrm.expressionManager.setValue('aa',talking?(0.12+Math.abs(Math.sin(now/95))*.25):0);
  }
 }
 renderer.render(scene,camera);
}
requestAnimationFrame(animate);
</script>
</body>
</html>
