<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:radial-gradient(ellipse at 50% 42%,#292344 0%,#171827 48%,#10121d 100%);font-family:system-ui,-apple-system,Segoe UI,sans-serif}
#stage{position:absolute;inset:0}
#stage canvas{display:block;width:100%;height:100%}
#topbar{position:absolute;left:14px;right:14px;top:12px;display:flex;justify-content:flex-end;gap:7px;z-index:2}
button{border:1px solid #8d83ca88;background:#211f36dd;color:#f7f5ff;border-radius:20px;padding:8px 13px;font-size:12px;font-weight:600;letter-spacing:.1px}
button:active{background:#51458c}
#status{position:absolute;left:14px;bottom:12px;color:#f1efff;background:#211f36e8;border:1px solid #8d83ca66;border-radius:20px;padding:8px 13px;font-size:12px;font-weight:600;z-index:2}
#loading{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:#e8e4ff;font-size:13px;text-align:center;padding:22px;z-index:1}
#loading .spinner{width:25px;height:25px;border:2px solid #77709a;border-top-color:#d7c8ff;border-radius:50%;animation:spin .8s linear infinite}
#loading.error .spinner{display:none}
#loading small{color:#aaa6c2;line-height:1.45;max-width:270px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
    "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.3.0/lib/three-vrm.module.min.js",
    "@pixiv/three-vrm-animation": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm-animation@3.3.0/lib/three-vrm-animation.module.js"
  }
}
</script>
</head>
<body>
<div id="stage"></div>
<div id="loading"><div class="spinner"></div><span id="loading-title">Preparing Lucy…</span><small id="loading-detail">Loading the 3D character and animations</small></div>
<div id="topbar">
<button onclick="playClip('greeting')">Wave</button>
<button onclick="playClip('dance')">Dance</button>
<button onclick="playClip('peaceSign')">Peace</button>
</div>
<div id="status">Ready</div>
<script>
const loading=document.getElementById('loading');
const loadingTitle=document.getElementById('loading-title');
const loadingDetail=document.getElementById('loading-detail');
const status=document.getElementById('status');
function showError(message){
 loading.classList.add('error');
 loadingTitle.textContent='Lucy avatar could not load';
 loadingDetail.textContent=message+' You can still use voice controls. Check your internet connection and reopen the screen.';
}
let playClip=()=>{};
window.playClip=(name)=>playClip(name);
window.setAssistantState=function(state){
 const labels={idle:'Ready',listening:'Listening',capturing:'Viewing screen',analyzing:'Thinking',speaking:'Speaking',executingAction:'Working',waitingConfirmation:'Needs confirmation'};
 status.textContent=labels[state]||'Ready';
};
(async()=>{
 try{
  // Dynamic imports ensure network/module errors are caught and shown instead
  // of leaving the screen stuck on the loading message forever.
  let THREE,GLTF,VRM,VRMA;
  try {
   [THREE,GLTF,VRM,VRMA]=await Promise.all([
    import('three'),
    import('three/addons/loaders/GLTFLoader.js'),
    import('@pixiv/three-vrm'),
    import('@pixiv/three-vrm-animation')
   ]);
  } catch (moduleError) {
   throw new Error('Could not download the 3D rendering libraries. Open Lucy with a working internet connection, then try again. Details: '+(moduleError?.message||moduleError));
  }
  const host=document.getElementById('stage');
  const scene=new THREE.Scene();
  const camera=new THREE.PerspectiveCamera(30,1,.1,100);
  const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.75));
  renderer.outputColorSpace=THREE.SRGBColorSpace;
  host.appendChild(renderer.domElement);
  scene.add(new THREE.HemisphereLight(0xffffff,0x45405f,2));
  const key=new THREE.DirectionalLight(0xffffff,2.2);key.position.set(1,2,3);scene.add(key);
  const fill=new THREE.PointLight(0x8278ff,18,8);fill.position.set(-1,1.5,1.5);scene.add(fill);
  const loader=new GLTF.GLTFLoader();
  loader.register(parser=>new VRM.VRMLoaderPlugin(parser));
  loader.register(parser=>new VRMA.VRMAnimationLoaderPlugin(parser));
  let vrm=null,mixer=null,currentAction=null,lastTime=0;
  const clipCache=new Map();
  function resize(){
   const w=host.clientWidth||innerWidth,h=host.clientHeight||220;
   renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();
  }
  new ResizeObserver(resize).observe(host);resize();
  async function loadClip(name){
   if(clipCache.has(name))return clipCache.get(name);
   const gltf=await loader.loadAsync('../amica/animations/'+name+'.vrma');
   const animation=gltf.userData.vrmAnimations?.[0];
   if(!animation)throw new Error('Animation not found: '+name);
   const clip=VRMA.createVRMAnimationClip(animation,vrm);
   clipCache.set(name,clip);return clip;
  }
  playClip=async(name)=>{
   if(!vrm||!mixer)return;
   try{
    const clip=await loadClip(name);
    if(currentAction)currentAction.fadeOut(.2);
    currentAction=mixer.clipAction(clip);
    currentAction.reset().fadeIn(.2).play();
   }catch(error){console.warn('Animation unavailable: '+name,error);}
  };
  const gltf=await loader.loadAsync('../amica/vrm/AvatarSample_A.vrm');
  vrm=gltf.userData.vrm;
  if(!vrm)throw new Error('VRM model did not contain an avatar.');
  VRM.VRMUtils.rotateVRM0(vrm);
  vrm.scene.rotation.y=Math.PI;
  scene.add(vrm.scene);
  const avatarBounds=new THREE.Box3().setFromObject(vrm.scene);
  const avatarSize=avatarBounds.getSize(new THREE.Vector3());
  const avatarCenter=avatarBounds.getCenter(new THREE.Vector3());
  const verticalFit=avatarSize.y/(2*Math.tan(THREE.MathUtils.degToRad(camera.fov/2)));
  camera.position.set(avatarCenter.x, avatarCenter.y + avatarSize.y*0.035, avatarCenter.z + verticalFit*1.12);
  camera.lookAt(avatarCenter.x, avatarCenter.y, avatarCenter.z);
  mixer=new THREE.AnimationMixer(vrm.scene);
  await playClip('idle_loop');
  loading.style.display='none';
  function animate(now){
   requestAnimationFrame(animate);
   const delta=lastTime?Math.min((now-lastTime)/1000,.05):0;lastTime=now;
   if(mixer)mixer.update(delta);
   if(vrm){
    vrm.update(delta);
    if(vrm.expressionManager){
     const talking=status.textContent==='Speaking';
     const mouth= talking ? (0.12 + Math.abs(Math.sin(now/72))*0.48 + Math.abs(Math.sin(now/137))*0.18) : 0;
     vrm.expressionManager.setValue('aa',Math.min(mouth,0.82));
     const blinkCycle=now%4300;
     const blink=blinkCycle>4050 ? Math.sin((blinkCycle-4050)/250*Math.PI) : 0;
     vrm.expressionManager.setValue('blink',Math.max(0,blink));
    }
   }
   renderer.render(scene,camera);
  }
  requestAnimationFrame(animate);
 }catch(error){
  console.error('Lucy 3D avatar initialization failed:',error);
  showError(error?.message||'A 3D component failed to initialize.');
 }
})();
</script>
</body>
</html>
