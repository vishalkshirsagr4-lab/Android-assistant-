name: CI

on:
  push:
    branches: [main, fix/lucy-main-pr13-integration, phase1/lucy-safe-autopilot-foundation, phase3/lucy-speed-layer, phase4/lucy-screen-intelligence, phase5/lucy-ui-memory-skills, phase6/lucy-personality-memory-settings, fix/lucy-deep-read-stop-coverage, stage2/safety-settings-hardening, stage3/screenwatcher-hardening, stage4/approved-learning-memory, stage5/hindi-kannada-voice-onboarding, stage6/performance-stability, stage7/release-regression-docs, stage8/voice-resilience-entity-understanding]
  pull_request:
    branches: [main, fix/lucy-main-pr13-integration, phase1/lucy-safe-autopilot-foundation, phase3/lucy-speed-layer, phase4/lucy-screen-intelligence, phase5/lucy-ui-memory-skills, phase6/lucy-personality-memory-settings, fix/lucy-deep-read-stop-coverage, stage2/safety-settings-hardening, stage3/screenwatcher-hardening, stage4/approved-learning-memory, stage5/hindi-kannada-voice-onboarding, stage6/performance-stability, stage7/release-regression-docs, stage8/voice-resilience-entity-understanding]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.1"

jobs:
  analyze:
    name: Format, analyze & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format Dart files
        run: dart format .
      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        # Infos (avoid_print, deprecated withOpacity) are tracked as cleanup
        # issues — see CONTRIBUTING.md. Warnings and errors still fail the build.
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Run Android JVM unit tests
        working-directory: android
        shell: bash
        run: |
          # Maven Central can temporarily return HTTP 429 from its mirror.
          # Retry dependency resolution without hiding genuine test failures.
          for attempt in 1 2 3; do
            echo "Android JVM unit-test attempt ${attempt}/3"
            if ./gradlew testDebugUnitTest --no-daemon; then
              exit 0
            fi
            if [ "${attempt}" -lt 3 ]; then
              sleep $((attempt * 20))
            fi
          done
          echo "Android JVM unit tests failed after 3 attempts."
          exit 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lucy-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
          if-no-files-found: error
