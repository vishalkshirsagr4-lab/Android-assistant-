name: Build APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: APK build type
        required: true
        default: debug
        type: choice
        options:
          - debug
          - release

permissions:
  contents: read

concurrency:
  group: manual-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.1"

jobs:
  build:
    name: Build and upload ${{ inputs.build_type }} APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Configure permanent release signing
        if: inputs.build_type == 'release'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64}" ] || [ -z "${KEYSTORE_PASSWORD}" ] || [ -z "${KEY_ALIAS}" ] || [ -z "${KEY_PASSWORD}" ]; then
            echo "::error::Release signing secrets are missing. Refusing to create a debug-signed release APK."
            exit 1
          fi
          printf '%s' "${KEYSTORE_BASE64}" | base64 -d > "${RUNNER_TEMP}/lucy-release.jks"
          keytool -list -keystore "${RUNNER_TEMP}/lucy-release.jks" -alias "${KEY_ALIAS}" -storepass "${KEYSTORE_PASSWORD}" >/dev/null
          {
            echo "storeFile=${RUNNER_TEMP}/lucy-release.jks"
            echo "storePassword=${KEYSTORE_PASSWORD}"
            echo "keyAlias=${KEY_ALIAS}"
            echo "keyPassword=${KEY_PASSWORD}"
          } > android/key.properties
          echo "Permanent release keystore configured and alias verified."

      - name: Build debug APK
        if: inputs.build_type == 'debug'
        run: flutter build apk --debug

      - name: Build signed release APK
        if: inputs.build_type == 'release'
        run: flutter build apk --release

      - name: Verify release APK signature
        if: inputs.build_type == 'release'
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          apksigner verify --verbose "$APK"
          apksigner verify --print-certs "$APK"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: lucy-${{ inputs.build_type }}-apk
          path: build/app/outputs/flutter-apk/app-${{ inputs.build_type }}.apk
          retention-days: 14
          if-no-files-found: error

      - name: Build summary
        run: |
          echo "### APK ready" >> "$GITHUB_STEP_SUMMARY"
          echo "Download the APK from the Artifacts section of this workflow run." >> "$GITHUB_STEP_SUMMARY"
          ls -lh build/app/outputs/flutter-apk/app-${{ inputs.build_type }}.apk >> "$GITHUB_STEP_SUMMARY"
