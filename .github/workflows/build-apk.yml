name: Build APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: APK build type
        required: true
        default: debug
        type: choice
        options:
          - debug
          - release

permissions:
  contents: read

concurrency:
  group: manual-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.1"

jobs:
  build:
    name: Build and upload ${{ inputs.build_type }} APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Build debug APK
        if: inputs.build_type == 'debug'
        run: flutter build apk --debug

      - name: Build release APK
        if: inputs.build_type == 'release'
        run: flutter build apk --release

      - name: Upload installable APK
        uses: actions/upload-artifact@v7
        with:
          name: lucy-${{ inputs.build_type }}-apk
          path: build/app/outputs/flutter-apk/app-${{ inputs.build_type }}.apk
          retention-days: 14
          if-no-files-found: error

      - name: Build summary
        run: |
          echo "### APK ready" >> "$GITHUB_STEP_SUMMARY"
          echo "Download the APK from the Artifacts section of this workflow run." >> "$GITHUB_STEP_SUMMARY"
          ls -lh build/app/outputs/flutter-apk/app-${{ inputs.build_type }}.apk >> "$GITHUB_STEP_SUMMARY"
